<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geosan Cup Draft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: arena scoreboard header, step tabs like a shot-clock row, one working panel per step.
   Single dark "arena at night" look by choice; every color set explicitly. */
:root {
  color-scheme: dark;
  --ink: #0a1222;        /* arena navy */
  --panel: #111c33;
  --panel-2: #172442;
  --line: #24365c;
  --fg: #eef2fa;
  --muted: #8f9cba;
  --ball: #f26b1d;       /* basketball orange */
  --ball-deep: #c24d0c;
  --led: #ffb547;        /* scoreboard amber */
  --good: #5fd39a;
  --bad: #ff5d5d;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 50% -200px, #1b2c55 0%, transparent 70%),
    var(--ink);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
}
/* faint center-court lines */
body::after {
  content: ""; position: fixed; z-index: 0; pointer-events: none;
  left: 50%; top: 58%; width: 760px; height: 760px; translate: -50% -50%;
  border-radius: 50%;
  border: 2px solid rgba(242,107,29,.07);
  box-shadow: 0 0 0 140px transparent, inset 0 0 0 230px transparent;
  background: radial-gradient(circle, transparent 118px, rgba(242,107,29,.07) 119px, rgba(242,107,29,.07) 121px, transparent 122px);
}
.wrap {
  position: relative; z-index: 1;
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 60px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }

/* ---------- scoreboard header ---------- */
.board {
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  background: linear-gradient(180deg, #0d1730, #0a1226);
  border: 1px solid var(--line); border-radius: 20px;
  padding: 18px 22px;
  box-shadow: 0 20px 60px -30px #000, inset 0 1px 0 rgba(255,255,255,.04);
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.logo-ball { width: 54px; height: 54px; flex: none; animation: spin 14s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.brand h1 {
  margin: 0; font-family: var(--f-display); font-weight: 900;
  font-size: clamp(20px, 3.4vw, 34px); letter-spacing: .02em; line-height: 1.05;
  text-wrap: balance;
}
.brand h1 span { color: var(--ball); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
.board-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.led {
  font-family: var(--f-mono); font-weight: 700; color: var(--led);
  background: #05080f; border: 1px solid #2a2212; border-radius: 10px;
  padding: 6px 12px; font-size: 20px; letter-spacing: .08em;
  text-shadow: 0 0 10px rgba(255,181,71,.55); font-variant-numeric: tabular-nums;
}
.led small { display: block; font-size: 9px; letter-spacing: .2em; color: #a3742c; text-shadow: none; text-transform: uppercase; }
.lang { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 999px;
  font-weight: 700; font-size: 13px; color: var(--muted); transition: .2s;
}
.lang button[aria-pressed="true"] { background: var(--ball); color: #fff; box-shadow: 0 4px 14px -4px var(--ball); }

/* ---------- step tabs ---------- */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 18px 0 22px; }
.step {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  font-weight: 600; text-align: left; transition: transform .15s, border-color .2s, background .2s;
  min-width: 0;
}
.step:hover { transform: translateY(-2px); border-color: #35508a; }
.step .n {
  flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 12px; background: var(--panel-2); color: var(--muted);
}
.step .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step[aria-current="step"] { background: linear-gradient(135deg, var(--ball), var(--ball-deep)); border-color: transparent; color: #fff; }
.step[aria-current="step"] .n { background: rgba(0,0,0,.25); color: #fff; }
.step.done .n { background: var(--good); color: #062014; }

/* ---------- generic ---------- */
.panel { animation: rise .35s ease both; }
@keyframes rise { from { opacity: .3; transform: translateY(8px); } }
.head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 28px); text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px;
  padding: 10px 16px; font-weight: 600; transition: transform .12s, background .2s, border-color .2s, box-shadow .2s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #3a5794; }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(180deg, #ff7f33, var(--ball)); border-color: var(--ball-deep); color: #fff;
  box-shadow: 0 10px 24px -10px var(--ball), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn.primary:hover:not(:disabled) { box-shadow: 0 14px 30px -10px var(--ball), inset 0 1px 0 rgba(255,255,255,.3); }
.btn.big { padding: 14px 22px; font-size: 16px; border-radius: 14px; }
.btn.ghost { background: transparent; }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btn.icon { padding: 8px 10px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 20px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.input, select.input, textarea.input {
  width: 100%; background: #0b1428; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px; outline: none; transition: border-color .2s, box-shadow .2s;
}
.input:focus { border-color: var(--ball); box-shadow: 0 0 0 3px rgba(242,107,29,.18); }
.note {
  display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px;
  background: rgba(255,181,71,.08); border: 1px solid rgba(255,181,71,.25); color: var(--led); font-size: 14px; margin-bottom: 16px;
}
.tag {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}
.pos {
  flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  font-family: var(--f-mono); font-weight: 700; font-size: 12px;
}
.pos.G { background: rgba(59,163,245,.16); color: #7cc4ff; }
.pos.F { background: rgba(95,211,154,.16); color: #7fe3b2; }
.pos.C { background: rgba(224,85,155,.16); color: #f28cc0; }
.swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }

/* ---------- teams ---------- */
.teams { display: grid; gap: 12px; }
.team-row {
  display: grid; grid-template-columns: 120px minmax(0,1.3fr) minmax(0,1fr) minmax(170px,1.2fr) auto; gap: 16px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c);
  border-radius: var(--r); padding: 14px 16px; transition: transform .25s;
}
.team-row.moved { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.02); background: var(--panel-2); } }
.place { display: grid; gap: 2px; }
.place b { font-family: var(--f-display); font-size: 22px; line-height: 1; color: var(--c); }
.place span { font-size: 12px; color: var(--muted); font-weight: 600; }
.tix { display: grid; gap: 6px; }
.tix-row { display: flex; gap: 4px; }
.ticket {
  width: 22px; height: 30px; border-radius: 5px; background: var(--c); position: relative;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); animation: pop .35s ease both;
}
.ticket::before, .ticket::after { content: ""; position: absolute; left: -4px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--panel); }
.ticket::after { left: auto; right: -4px; }
@keyframes pop { from { transform: scale(.3) rotate(-15deg); opacity: 0; } }
.oddsbar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.oddsbar i { display: block; height: 100%; background: var(--c); border-radius: 3px; transition: width .5s; }
.tix small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.movers { display: flex; flex-direction: column; gap: 4px; }

/* ---------- players ---------- */
.players-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 18px; align-items: start; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.pcard {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); min-width: 0; animation: rise .3s ease both;
}
.pcard .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pcard .x { border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; flex: none; }
.pcard .x:hover:not(:disabled) { background: rgba(255,93,93,.15); color: var(--bad); }
.pcard .x:disabled { opacity: .3; cursor: not-allowed; }
.pcard select { width: 54px; padding: 4px 6px; font-size: 12px; }
.side { display: grid; gap: 14px; }
.side h3 { margin: 0 0 10px; font-size: 15px; }
.row2 { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }

/* ---------- lottery ---------- */
.lottery { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.machine { display: grid; justify-items: center; gap: 16px; text-align: center; position: relative; overflow: hidden; }
.drum-wrap { position: relative; width: min(320px, 100%); aspect-ratio: 1; max-width: 100%; }
#drum { width: 100%; height: 100%; display: block; }
.chute {
  width: 54px; height: 20px; margin-top: -26px; border-radius: 0 0 14px 14px;
  background: linear-gradient(180deg, #2a3e6a, #1a2848); border: 1px solid var(--line); border-top: 0;
}
.reveal { min-height: 132px; display: grid; justify-items: center; align-content: center; gap: 6px; }
.reveal .bigball {
  width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 900; font-size: 26px; color: #fff;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 32%), var(--c);
  box-shadow: 0 14px 30px -10px var(--c), inset 0 -6px 12px rgba(0,0,0,.25);
  animation: drop .7s cubic-bezier(.3,1.6,.5,1) both;
}
@keyframes drop { from { transform: translateY(-120px) scale(.4); opacity: 0; } }
.reveal .who { font-family: var(--f-display); font-weight: 700; font-size: 20px; animation: rise .5s .25s ease both; }
.reveal .lbl { color: var(--muted); font-size: 13px; animation: rise .5s .15s ease both; }
.reveal.idle .lbl { font-size: 14px; }
.order { display: grid; gap: 8px; }
.slot {
  display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); min-height: 58px;
}
.slot .no { font-family: var(--f-display); font-weight: 900; font-size: 22px; color: #3a4d78; }
.slot.filled { border: 1px solid var(--line); border-left: 4px solid var(--c); background: var(--panel); color: var(--fg); animation: slide .5s ease both; }
.slot.filled .no { color: var(--c); }
.slot .tn { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .meta { font-size: 12px; color: var(--muted); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.odds-list { display: grid; gap: 8px; margin-top: 4px; }
.odds-item { display: grid; grid-template-columns: minmax(0,1fr) 56px; gap: 10px; align-items: center; font-size: 13px; }
.odds-item .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
.odds-item .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.odds-item b { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.odds-item .oddsbar { grid-column: 1 / -1; }
.toggle { display: inline-flex; gap: 10px; align-items: center; font-size: 14px; cursor: pointer; user-select: none; }
.toggle input { appearance: none; width: 40px; height: 22px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); position: relative; cursor: pointer; transition: .2s; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: .2s; }
.toggle input:checked { background: var(--ball); border-color: var(--ball); }
.toggle input:checked::after { left: 20px; background: #fff; }

/* ---------- draft ---------- */
.draft { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.clock {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: center;
  padding: 20px 22px; border-radius: 18px; position: relative; overflow: hidden;
  background: linear-gradient(120deg, color-mix(in srgb, var(--c) 30%, var(--panel)), var(--panel) 65%);
  border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line));
}
.clock::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%);
  translate: -100% 0; animation: sheen 3.2s ease-in-out infinite;
}
@keyframes sheen { 60%, 100% { translate: 100% 0; } }
.clock .who { min-width: 0; }
.clock .tag { color: color-mix(in srgb, var(--c) 70%, #fff); }
.clock .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.clock h2 { margin: 6px 0 4px; font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 4vw, 40px); line-height: 1.05; text-wrap: balance; overflow-wrap: anywhere; }
.clock .sub { color: var(--muted); font-size: 14px; }
.clock.change { animation: flash .8s ease; }
@keyframes flash { 0% { filter: brightness(1.8); transform: scale(1.01); } }
.shot { display: grid; justify-items: center; gap: 6px; }
.shot .led { font-size: 34px; min-width: 96px; text-align: center; }
.shot .led.warn { color: var(--bad); text-shadow: 0 0 12px rgba(255,93,93,.7); animation: blink .5s steps(2) infinite; }
.shot-btns { display: flex; gap: 6px; }
.shot-btns .btn { padding: 6px 10px; font-size: 12px; }
.upnext { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 18px; font-size: 13px; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--fg); white-space: nowrap;
}
.chip .num { font-family: var(--f-mono); color: var(--muted); font-size: 11px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters .input { flex: 1 1 200px; width: auto; }
.fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--muted); transition: .2s; }
.fchip[aria-pressed="true"] { background: var(--fg); color: var(--ink); border-color: var(--fg); }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.pbtn {
  display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); min-width: 0;
  transition: transform .15s, border-color .2s, box-shadow .2s, background .2s;
}
.pbtn .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbtn:hover { transform: translateY(-3px); border-color: var(--oc); box-shadow: 0 12px 24px -14px var(--oc); background: var(--panel-2); }
.pbtn:hover .nm::after { content: " +"; color: var(--oc); }
.empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.rosters { display: grid; gap: 10px; }
.roster { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .3s, box-shadow .3s; }
.roster.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 10px 30px -16px var(--c); }
.roster header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.roster header b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster header .cnt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.roster ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 5px; }
.roster li { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); display: inline-flex; gap: 6px; align-items: center; }
.roster li .pk { font-family: var(--f-mono); color: var(--muted); font-size: 10px; }
.roster li.new { animation: pop .5s ease; background: color-mix(in srgb, var(--c) 35%, var(--panel-2)); }
.roster .none { font-size: 12px; color: var(--muted); }
.done-banner { text-align: center; padding: 34px 20px; display: grid; gap: 14px; justify-items: center; }
.done-banner h2 { margin: 0; font-family: var(--f-display); font-size: clamp(26px, 4vw, 40px); }

/* ---------- results ---------- */
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.rcard { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--r); padding: 16px; animation: rise .4s ease both; }
.rcard h3 { margin: 0 0 2px; font-family: var(--f-display); font-size: 17px; overflow-wrap: anywhere; }
.rcard .cap { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.rcard ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.rcard li { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.rcard li span.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcard li .pk { font-family: var(--f-mono); color: var(--muted); font-size: 11px; }
#copyText { margin-top: 14px; font-family: var(--f-mono); font-size: 12px; min-height: 140px; }

/* ---------- modal / toast ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
  background: rgba(3,6,14,.72); backdrop-filter: blur(6px); animation: fade .2s ease;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  padding: 24px; display: grid; gap: 16px; text-align: center; animation: zoom .3s cubic-bezier(.3,1.4,.5,1);
}
@keyframes zoom { from { transform: scale(.85); opacity: 0; } }
.modal h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
.modal .vs { display: grid; gap: 8px; justify-items: center; }
.modal .vs .p { font-family: var(--f-display); font-weight: 900; font-size: 26px; overflow-wrap: anywhere; }
.modal .vs .arrow { color: var(--muted); font-size: 22px; }
.modal .vs .t { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--c); }
.modal .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.modal p { margin: 0; }
.toast {
  position: fixed; z-index: 60; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); translate: -50% 0;
  background: var(--fg); color: var(--ink); padding: 12px 18px; border-radius: 12px; font-weight: 700;
  box-shadow: 0 20px 40px -10px #000; animation: toast 2.6s ease both; max-width: calc(100% - 32px); text-align: center;
}
@keyframes toast { 0% { opacity: 0; transform: translateY(20px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.pickin {
  position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; pointer-events: none;
}
.pickin div {
  font-family: var(--f-display); font-weight: 900; text-align: center; font-size: clamp(28px, 7vw, 72px); line-height: 1;
  color: #fff; text-shadow: 0 6px 30px var(--c), 0 0 2px #000; animation: slam 1.6s ease both; padding: 0 16px;
}
.pickin small { display: block; font-size: .32em; margin-top: 14px; font-family: var(--f-body); font-weight: 700; letter-spacing: .04em; overflow-wrap: anywhere; }
@keyframes slam { 0% { transform: scale(2.2); opacity: 0; } 15% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(.96); } }
#confetti { position: fixed; inset: 0; z-index: 54; pointer-events: none; width: 100%; height: 100%; }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .draft, .players-layout, .lottery { grid-template-columns: minmax(0,1fr); }
  .team-row { grid-template-columns: 90px minmax(0,1fr) auto; }
  .team-row .f-cap { grid-column: 2 / 3; }
  .team-row .tix { grid-column: 1 / -1; }
  .team-row .movers { grid-column: 3; grid-row: 1 / 3; flex-direction: column; }
}
@media (max-width: 640px) {
  .board { grid-template-columns: minmax(0,1fr); }
  .board-right { justify-content: flex-start; }
  .steps { grid-template-columns: repeat(5, minmax(0,1fr)); gap: 4px; }
  .step { padding: 10px 6px; justify-content: center; }
  .step .lbl { display: none; }
  .clock { grid-template-columns: minmax(0,1fr); }
  .shot { justify-items: start; }
  .team-row { grid-template-columns: minmax(0,1fr) auto; }
  .team-row .place { grid-column: 1; }
  .team-row .f-name, .team-row .f-cap, .team-row .tix { grid-column: 1 / -1; }
  .team-row .movers { grid-column: 2; grid-row: 1; flex-direction: row; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

  function startDrum() {
    const cv = $("#drum"); if (!cv) return;
    const ctx = cv.getContext("2d"), W = cv.width, R = W / 2 - 18, cx = W / 2, cy = W / 2, br = 30;
    const taken = new Set(order());
    const balls = S.lottery.tickets.filter(tk => !taken.has(tk.teamId)).map(tk => {
      const a = Math.random() * Math.PI * 2, d = Math.random() * (R - br - 10);
      return { ...tk, x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d + R * .3, vx: (Math.random() - .5) * 2, vy: 0, color: team(tk.teamId).color };
    });
    drum = { ctx, balls, raf: 0, mix: 0 };
    let angle = 0;
    const step = () => {
      const mixP = drum.mix;
      angle += 0.004 + mixP * 0.05;
      for (const b of balls) {
        b.vy += 0.35;                                   // gravity
        if (mixP) { b.vx += (Math.random() - .5) * 3.2 * mixP; b.vy -= Math.random() * 1.6 * mixP + .25 * mixP; }
        b.vx *= .992; b.vy *= .992;
        b.x += b.vx; b.y += b.vy;
        const dx = b.x - cx, dy = b.y - cy, dist = Math.hypot(dx, dy), lim = R - br;
        if (dist > lim) {
          const nx = dx / dist, ny = dy / dist;
          b.x = cx + nx * lim; b.y = cy + ny * lim;
          const dot = b.vx * nx + b.vy * ny;
          b.vx -= 1.75 * dot * nx; b.vy -= 1.75 * dot * ny;
          b.vx += -ny * 0.4; b.vy += nx * 0.4;          // drum rotation drag
        }
      }
      for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], c = balls[j], dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 1;
        if (d < br * 2) { const o = (br * 2 - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * o; a.y -= ny * o; c.x += nx * o; c.y += ny * o;
          const rv = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny; if (rv < 0) { a.vx += rv * nx * .9; a.vy += rv * ny * .9; c.vx -= rv * nx * .9; c.vy -= rv * ny * .9; } }
      }
      // draw
      ctx.clearRect(0, 0, W, W);
      const g = ctx.createRadialGradient(cx - 60, cy - 80, 20, cx, cy, R + 10);
      g.addColorStop(0, "rgba(120,160,240,.16)"); g.addColorStop(1, "rgba(20,30,60,.5)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle); ctx.strokeStyle = "rgba(160,190,255,.10)"; ctx.lineWidth = 3;
      for (let k = 0; k < 6; k++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R, 0); ctx.stroke(); }
      ctx.restore();
      for (const b of balls) {
        const bg = ctx.createRadialGradient(b.x - 9, b.y - 10, 2, b.x, b.y, br);
        bg.addColorStop(0, "#ffffffcc"); bg.addColorStop(.25, b.color); bg.addColorStop(1, shade(b.color));
        ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(b.x, b.y, br, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#0a1222"; ctx.font = "700 17px 'JetBrains Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(b.n, b.x, b.y + 1);

      ctx.strokeStyle = "rgba(180,205,255,.35)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, R - 14, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();

  }
  function shade(hex) {

    if (el.id === "clockToggle") return clock.run ? clockStop() : clockStart();
    if (el.id === "clockReset") return clockReset();
    if (el.id === "copyBtn") {
      const txt = resultsText(), ta = $("#copyText");
      const fallback = () => { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast(t("copy_fail")); };
      try { navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback); } catch { fallback(); }
    }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.tname) { team(el.dataset.tname).name = el.value || "—"; save(); }
    else if (el.dataset.tcap) { team(el.dataset.tcap).captain = el.value; save(); }
    else if (el.id === "q") { filter.q = el.value; renderPool(); }
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.ppos) { const p = player(el.dataset.ppos); p.pos = el.value; save(); renderPlayers($("#main")); }
    if (el.id === "snake") { S.snake = el.checked; save(); }
  });
  document.addEventListener("submit", e => {
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    const nm = $("#newName").value.trim(); if (!nm) return;
    S.players.push({ id: uid(), name: nm, pos: $("#newPos").value }); save();
    renderChrome(); renderPlayers($("#main")); $("#newName").focus();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  render();
})();
</script>
